version: '3.8'

services:

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - catalog-service
      - order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVICES_CATALOG_URL: http://catalog-service:8082
      SERVICES_ORDER_URL: http://order-service:8083
    networks:
      - microservices-network

  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: catalog-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://modulos-database.clssk0ausycc.eu-central-1.rds.amazonaws.com:5432/modulos-database
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - microservices-network

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://modulos-database.clssk0ausycc.eu-central-1.rds.amazonaws.com:5432/modulos-database
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AWS_REGION: eu-central-1
      SQS_QUEUE_NAME: order-created
      AWS_ACCESS_KEY_ID: ${ORDER_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${ORDER_AWS_SECRET_ACCESS_KEY}
    networks:
      - microservices-network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AWS_REGION: eu-central-1
      SQS_QUEUE_NAME: order-created
      AWS_SES_FROM: noreply@example.com
      AWS_ACCESS_KEY_ID: ${NOTIFICATION_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${NOTIFICATION_AWS_SECRET_ACCESS_KEY}
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge