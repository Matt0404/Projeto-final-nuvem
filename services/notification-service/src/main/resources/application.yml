spring:
  application:
    name: notification-service

server:
  port: 8083

# SQS consumer — enable and set queue-url via env vars or override here
cloud:
  sqs:
    order-created-consumer:
      enabled: ${SQS_ENABLED:false}
      queue-url: ${SQS_QUEUE_URL:}
      region: ${AWS_REGION:eu-west-1}
      poll-interval-ms: 5000
      max-number-of-messages: 10
      wait-time-seconds: 20

  # SES email sender — set enabled=false to only log (no real email sent)
  ses:
    enabled: ${SES_ENABLED:false}
    region: ${AWS_REGION:eu-west-1}
    from-email: ${SES_FROM_EMAIL:no-reply@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
