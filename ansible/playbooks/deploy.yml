# ansible/playbooks/deploy.yml
# Faz pull das novas imagens e reinicia cada serviço na EC2 certa

# ── 0. Instalar Python3 em todas as EC2 ──────────────────────────
- name: Ensure Python3 is installed
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Enable python39 on Amazon Linux 2
      raw: |
        # Amazon Linux 2: python3.9 está no amazon-linux-extras
        if amazon-linux-extras list 2>/dev/null | grep -q python3.9; then
          amazon-linux-extras install python3.9 -y
        # Amazon Linux 2023: está no dnf directamente
        elif dnf list available python3.9 2>/dev/null | grep -q python3.9; then
          dnf install -y python3.9
        # Fallback
        else
          yum install -y python3.9 || yum install -y python38 || yum install -y python3
        fi

    - name: Verify python3.9 exists
      raw: ls /usr/bin/python3.9 && /usr/bin/python3.9 --version
      register: py_check
      changed_when: false

    - name: Show python found
      debug:
        var: py_check.stdout





# ── 1. API Gateway (subnet pública) ──────────────────────────────
- name: Deploy api-gateway
  hosts: api_gateway
  become: true
  vars:
    service_name: api-gateway
    image: "{{ ecr_registry }}/api-gateway:{{ image_tag }}"
    host_port: 8080
    container_port: 8080
  tasks:
    - name: Login to ECR
      shell: >
        aws ecr get-login-password --region eu-central-1 |
        docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Pull image
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull
        force_source: true

    - name: Run container
      community.docker.docker_container:
        name: "{{ service_name }}"
        image: "{{ image }}"
        state: started
        restart_policy: always
        restart: true
        ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          SPRING_PROFILES_ACTIVE: docker
          SERVICES_CATALOG_URL: "http://{{ hostvars[groups['catalog_service'][0]]['ansible_host'] }}:8082"
          SERVICES_ORDER_URL: "http://{{ hostvars[groups['order_service'][0]]['ansible_host'] }}:8083"

# ── 2. Catalog Service (subnet privada) ──────────────────────────
- name: Deploy catalog-service
  hosts: catalog_service
  become: true
  vars:
    service_name: catalog-service
    image: "{{ ecr_registry }}/catalog-service:{{ image_tag }}"
  tasks:
    - name: Login to ECR
      shell: >
        aws ecr get-login-password --region eu-central-1 |
        docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Pull image
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull
        force_source: true

    - name: Run container
      community.docker.docker_container:
        name: "{{ service_name }}"
        image: "{{ image }}"
        state: started
        restart_policy: always
        restart: true
        ports:
          - "8082:8082"
        env:
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: "{{ lookup('env', 'SPRING_DATASOURCE_URL') | default('jdbc:postgresql://modulos-database.clssk0ausycc.eu-central-1.rds.amazonaws.com:5432/modulos-database') }}"
          SPRING_DATASOURCE_USERNAME: "{{ lookup('env', 'DB_USERNAME') }}"
          SPRING_DATASOURCE_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"

# ── 3. Order Service (subnet privada) ────────────────────────────
