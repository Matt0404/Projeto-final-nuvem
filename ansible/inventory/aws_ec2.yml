# ansible/inventory/aws_ec2.yml
# Inventário dinâmico — descobre as EC2 pelo tag Project + Name
plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

filters:
  tag:Project: mini-ecommerce
  instance-state-name: running

keyed_groups:
  # Cria grupos pelo tag Name: api_gateway, catalog_service, etc.
  - key: tags.Name
    prefix: ""
    separator: ""

hostnames:
  - ip-address   # usa IP público para as instâncias públicas (api_gateway)
  - private-ip-address

compose:
  ansible_host: public_ip_address | default(private_ip_address)
  ansible_python_interpreter: /usr/bin/python3
  ansible_ssh_common_args: >-
    -o StrictHostKeyChecking=no
    -o ForwardAgent=yes
    -o ProxyJump=ec2-user@3.67.194.185
