# ansible/inventory/aws_ec2.yml
# Inventário dinâmico — descobre as EC2 pelo tag Project + Name
plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

filters:
  tag:Project: mini-ecommerce
  instance-state-name: running

keyed_groups:
  # Cria grupos pelo tag Name: api_gateway, catalog_service, etc.
  - key: tags.Name
    prefix: ""
    separator: ""

hostnames:
  - ip-address
  - private-ip-address

compose:
  # api_gateway usa IP público (subnet pública, acessível diretamente)
  # os restantes usam IP privado (subnet privada, acesso via ProxyJump)
  # Correcção: expressão numa única linha, com | default() como safety-net
  # para o caso de public_ip_address estar None/vazio no momento da query
  ansible_host: "(public_ip_address | default(private_ip_address)) if (tags.Name | default('')) == 'api_gateway' else private_ip_address"
  ansible_user: "'ec2-user'"
  ansible_python_interpreter: "'/usr/bin/python3'"