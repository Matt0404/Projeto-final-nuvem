name: PR Pipeline — Lint, Test & Plan
on:
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: ./infrastructure/terraform/environments/dev 

jobs:
  # ─────────────────────────────────────────
  # 1. LINT (Checkstyle / Maven)
  # ─────────────────────────────────────────
  lint:
    name: Lint — all services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, catalog-service, order-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Checkstyle — ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn checkstyle:check --no-transfer-progress

  # ─────────────────────────────────────────
  # 2. UNIT TESTS
  # ─────────────────────────────────────────
  test:
    name: Test — all services
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api-gateway, catalog-service, order-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Unit tests — ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn test --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ─────────────────────────────────────────
  # 3. TERRAFORM PLAN (preview only)
  # ─────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write   # para comentar o plan no PR

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="key_name=${{ secrets.EC2_KEY_NAME }}"
        continue-on-error: true

      # Posta o plan como comentário no PR
      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1