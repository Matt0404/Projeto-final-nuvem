name: Deploy Pipeline — Build, Apply & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  TF_WORKING_DIR: ./infrastructure/terraform/environments/dev

jobs:
  # ─────────────────────────────────────────
  # 1. BUILD & PUSH — Docker images para ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: production          # requer aprovação manual (ver README)
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    strategy:
      matrix:
        service:
          - name: api-gateway
            port: 8080
          - name: catalog-service
            port: 8082
          - name: order-service
            port: 8083
          - name: notification-service
            port: 8081

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & Push — ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service.name }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest

  # ─────────────────────────────────────────
  # 2. TERRAFORM APPLY — infra actualizada
  # ─────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="key_name=${{ secrets.KEY_NAME }}"

      # Exporta os IPs das EC2 para o Ansible usar
      - name: Export EC2 IPs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform output -json ec2_ips > /tmp/ec2_ips.json
          cat /tmp/ec2_ips.json

      - name: Upload EC2 IPs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-ips
          path: /tmp/ec2_ips.json

  # ─────────────────────────────────────────
  # 3. ANSIBLE DEPLOY — pull images + restart
  # ─────────────────────────────────────────
  ansible-deploy:
    name: Ansible Deploy
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download EC2 IPs
        uses: actions/download-artifact@v4
        with:
          name: ec2-ips
          path: /tmp/

      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore --quiet
          ansible --version

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem
          # Adiciona ao ssh-agent para o ProxyJump funcionar
          eval $(ssh-agent -s)
          ssh-add /tmp/deploy_key.pem


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}





      - name: Debug inventory
        run: |
          ansible-inventory \
            -i ansible/inventory/aws_ec2.yml \
            --list









      - name: Run Ansible Playbook
        env:
          ANSIBLE_SSH_ARGS: "-o StrictHostKeyChecking=no -o ForwardAgent=yes -o ProxyJump=ec2-user@3.67.194.185"
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ORDER_AWS_ACCESS_KEY_ID: ${{ secrets.ORDER_AWS_ACCESS_KEY_ID }}
          ORDER_AWS_SECRET_ACCESS_KEY: ${{ secrets.ORDER_AWS_SECRET_ACCESS_KEY }}
          NOTIFICATION_AWS_ACCESS_KEY_ID: ${{ secrets.NOTIFICATION_AWS_ACCESS_KEY_ID }}
          NOTIFICATION_AWS_SECRET_ACCESS_KEY: ${{ secrets.NOTIFICATION_AWS_SECRET_ACCESS_KEY }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            ansible/playbooks/deploy.yml \
            --private-key /tmp/deploy_key.pem \
            --extra-vars "image_tag=${IMAGE_TAG} ecr_registry=${ECR_REGISTRY} ansible_python_interpreter=/usr/bin/python3" \
            --ssh-extra-args="-o StrictHostKeyChecking=no -o ForwardAgent=yes" \
            -u ec2-user
